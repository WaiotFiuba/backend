# Valores por defecto de los parametros del escenario. Los usan el worker (lo
# que manda el front pisa estos valores) y la CLI (el escenario que se le pasa
# con --scenario pisa estos valores).
#
# El worker relee este archivo al iniciar cada simulacion: en local (con el
# codigo montado en Docker) un cambio aplica a la proxima simulacion; en la VM
# hace falta reconstruir la imagen del simulador.
#
# Aca no van start, end, periods ni container_limit: son propios de cada
# corrida (los manda el front o el escenario de la CLI).

# Seed utilizada para aleatoriedad.
seed: 42

# Separacion base entre lecturas de un mismo sensor.
frequency_minutes: 60

# Variacion por dispositivo alrededor de la hora base de lectura.
# Ejemplo: 10 permite lecturas entre HH:50 y HH:10.
reading_jitter_minutes: 10

# Horas del dia en las que puede ocurrir una recoleccion.
collection_hours: [21, 22, 23, 0, 1, 2, 3, 4, 5, 6]

# Dias con recoleccion (0 = lunes ... 6 = domingo). Los demas no tienen.
collection_days: [0, 1, 2, 3, 4]

# Metodo secundario de recoleccion (solo si no se pudo armar la flota de camiones):
# probabilidad de que un sitio se recolecte en su turno de la noche.
collection_probability: 0.98

# Metodo secundario: probabilidad de que la recoleccion de un contenedor sea
# parcial (baja 25-55 puntos) en vez de vaciarlo.
partial_collection_probability: 0.03

# Multiplicador general de demanda. Valores > 1 llenan mas rapido.
high_demand_multiplier: 1.0

# Multiplicador extra para forzar escenarios de desborde.
overflow_stress_multiplier: 1.0

# Probabilidad por contenedor y por tick de cada falla de sensor.
noisy_sensor_probability: 0.0
stuck_sensor_probability: 0.0
fire_probability: 0.0
signal_loss_probability: 0.0
low_battery_probability: 0.0

# Factor relativo de llenado por tipo de residuo. Multiplica la demanda que el
# density processor le asigna a cada contenedor.
waste_type_factors:
  reciclables: 0.55
  residuos_humedos: 1.0
  vidrio: 0.55
