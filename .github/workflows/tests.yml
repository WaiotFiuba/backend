name: Python Tests
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --with pytest pytest
