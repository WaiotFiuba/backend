services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./db:/app/db
    command: >
      sh -c "
      uv run python -m app.commands.wait_for_map_db &&
      uv run alembic upgrade head &&
      uv run python -m app.commands.seed &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    depends_on:
      postgis:
        condition: service_healthy
        required: false    # no falla si postgis no levanta

  postgis:
    profiles:
      - map              # solo levanta si se utiliza docker-compose --profile map up
    build:
      context: .
      dockerfile: db/Dockerfile.postgis
    image: postgis-ogr2ogr:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/datos:/datos
      - ./db:/app/db
      - ./db/import_geojson.sh:/docker-entrypoint-initdb.d/20_import_geojson.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
