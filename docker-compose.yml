services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./simulator:/app/simulator
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./db:/app/db
      - ./datos:/app/datos
    command: >
      sh -c "
      if [ \"$${ENABLE_MAP_DB:-}\" = \"true\" ] || getent hosts postgis > /dev/null 2>&1; then
        export ENABLE_MAP_DB=true;
        uv run python -m app.commands.wait_for_map_db &&
        uv run alembic upgrade head &&
        uv run python -u -m app.commands.seed;
      else
        export ENABLE_MAP_DB=false;
        echo 'Base de mapa deshabilitada. Iniciando API sin PostGIS.';
      fi &&
      exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    depends_on:
      postgis:
        condition: service_healthy
        required: false    # no falla si postgis no levanta

  postgis:
    profiles:
      - map              # solo levanta si se utiliza docker-compose --profile map up
    build:
      context: .
      dockerfile: db/Dockerfile.postgis
    image: postgis-ogr2ogr:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./datos/digital_twin:/datos
      - ./db:/app/db
      - ./db/00_enable_postgis.sql:/docker-entrypoint-initdb.d/00_enable_postgis.sql
      - ./db/import_geojson.sh:/docker-entrypoint-initdb.d/20_import_geojson.sh
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c shared_buffers=256MB
      -c wal_buffers=16MB
      -c maintenance_work_mem=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  simulator:
    profiles:
      - map
    build: .
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api:8000
    volumes:
      - ./app:/app/app
      - ./simulator:/app/simulator
      - ./datos:/app/datos
      - ./db:/app/db
    command: >
      sh -c "
      exec uv run python -m simulator.worker
      "
    depends_on:
      api:
        condition: service_started

volumes:
  postgis_data:
