[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "pydantic-settings>=2.6.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "uvicorn>=0.46.0",
    "asyncpg>=0.31.0",
    "geoalchemy2>=0.13.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0.3",
    "numpy>=2.5.0",
    "shapely>=2.1.2",
    "pandas>=2.2.0",
    "scipy>=1.18.1",
    "chronos-forecasting>=2.0",
    "torch",
    "pyproj>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
